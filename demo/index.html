<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Demo - FastAPI & JS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-700 underline">RESEARCH PAPER DEMO</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">1. Input</h2>
                <input type="file" id="imageInput" class="block w-full text-sm text-gray-500 mb-4
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-full file:border-0
                    file:text-sm file:font-semibold
                    file:bg-blue-50 file:text-blue-700
                    hover:file:bg-blue-100 cursor-pointer"/>
                <div id="previewContainer" class="hidden">
                    <p class="text-xs text-gray-400 mb-1">Preview:</p>
                    <img id="inputPreview" src="#" class="w-full rounded border shadow-sm">
                </div>
                <button onclick="uploadAndPredict()" id="btnPredict" class="mt-6 w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition font-bold shadow-lg disabled:bg-gray-400">
                    Run Prediction 🚀
                </button>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-green-500">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">2. Result</h2>
                <div id="loading" class="hidden text-center text-blue-500 font-bold animate-pulse">Processing...</div>
                
                <div id="resultArea" class="hidden">
                    <img id="outputImage" src="#" class="w-full rounded border shadow-md mb-6">
                    
                    <h3 class="font-semibold text-gray-600 mb-2">Metrics Table:</h3>
                    <div class="overflow-x-auto">
                        <table class="min-w-full text-sm text-left text-gray-500 border">
                            <thead class="bg-gray-100 text-gray-700 uppercase">
                                <tr>
                                    <th class="px-4 py-2 border">Feature</th>
                                    <th class="px-4 py-2 border">Value</th>
                                </tr>
                            </thead>
                            <tbody id="resultTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Hiển thị preview ảnh khi chọn file
        const imageInput = document.getElementById('imageInput');
        imageInput.onchange = evt => {
            const [file] = imageInput.files;
            if (file) {
                document.getElementById('inputPreview').src = URL.createObjectURL(file);
                document.getElementById('previewContainer').classList.remove('hidden');
            }
        }

        async function uploadAndPredict() {
            const file = imageInput.files[0];
            if (!file) {
                alert("Please select an image first!");
                return;
            }

            // Giao diện khi đang xử lý
            const btn = document.getElementById('btnPredict');
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');
            
            btn.disabled = true;
            loading.classList.remove('hidden');
            resultArea.classList.add('hidden');

            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch('http://localhost:8000/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Hiển thị ảnh kết quả
                document.getElementById('outputImage').src = data.result_image;

                // Hiển thị bảng dữ liệu
                const tableBody = document.getElementById('resultTableBody');
                tableBody.innerHTML = ''; // Clear cũ
                data.table_data.forEach(row => {
                    const tr = `<tr>
                        <td class="px-4 py-2 border font-medium">${row.Feature}</td>
                        <td class="px-4 py-2 border text-blue-600">${row.Value}</td>
                    </tr>`;
                    tableBody.innerHTML += tr;
                });

                resultArea.classList.remove('hidden');
            } catch (error) {
                console.error("Error:", error);
                alert("Something went wrong!");
            } finally {
                btn.disabled = false;
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
